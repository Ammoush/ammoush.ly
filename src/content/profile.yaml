hero:
  tagline:
    en: "I keep ERP systems, data, and operations in sync, and build the tools that make them run better."
    ar: "أحافظ على تناغم أنظمة ERP والبيانات والعمليات، وأبني الأدوات التي ترفع كفاءتها."
  cta_primary: { en: "Get in touch", ar: "تواصل معي" }
  cta_secondary: { en: "LinkedIn", ar: "LinkedIn" }
  # The change journey panel next to the name. Illustrative: one change travels
  # from request to production and is checked at each of the three gates.
  console:
    label: { en: "Illustration: one change travels from request to production and is checked at every gate", ar: "رسم توضيحي: تغيير واحد ينتقل من الطلب إلى الإنتاج ويُفحص عند كل بوابة" }
    title: { en: "One change, three gates", ar: "تغيير واحد، ثلاث بوابات" }
    subtitle: { en: "From request to production, checked at every stop", ar: "من الطلب إلى الإنتاج، فحص عند كل محطة" }
    hint: { en: "Point at a gate to see what is checked there", ar: "مرّر على بوابة لترى ما يُفحص فيها" }
    gates:
      - name: { en: "Request", ar: "الطلب" }
        state: { en: "Spec written", ar: "كُتبت المواصفة" }
        detail: { en: "The operational need becomes a clear specification the development team can build from.", ar: "يتحوّل احتياج العمل إلى مواصفة واضحة يبني عليها فريق التطوير." }
      - name: { en: "Staging", ar: "بيئة الاختبار" }
        state: { en: "Tested", ar: "تم الاختبار" }
        detail: { en: "Every change is tested on staging before it goes anywhere near production.", ar: "يُختبر كل تغيير في بيئة الاختبار قبل أن يقترب من الإنتاج." }
      - name: { en: "Production", ar: "الإنتاج" }
        state: { en: "Verified", ar: "تم التحقق" }
        detail: { en: "The release is checked against the intended business outcome, then signed off.", ar: "يُقارن الإصدار بالنتيجة المطلوبة للعمل، ثم يُعتمد." }
    passed: { en: "Passed", ar: "اجتاز" }
    summary: { en: "of {total} gates passed", ar: "من {total} بوابات اجتازها التغيير" }
    done: { en: "Delivered", ar: "تم التسليم" }
    rerun: { en: "Run again", ar: "إعادة التشغيل" }

about:
  heading: { en: "About", ar: "نبذة" }
  body:
    en: "Technical Operations Manager at Presto, with about six years across IT support, ERP operations, and data. I turn operational needs into reliable systems and the tools that keep them running."
    ar: "مدير العمليات التقنية في Presto، بخبرة تقارب ست سنوات في الدعم الفني وتشغيل أنظمة ERP والبيانات. أحوّل احتياجات العمل اليومية إلى أنظمة موثوقة، وإلى أدوات تضمن استمرارها."

how_i_work:
  heading: { en: "How I work", ar: "طريقة عملي" }
  items:
    - step: { en: "Translate", ar: "أترجم" }
      title:
        en: "Between operations and technology"
        ar: "بين العمليات والتقنية"
      body:
        en: "I translate operational needs into clear technical specifications for the development team, then verify that what's delivered matches the intended business outcome."
        ar: "أترجم احتياجات العمل إلى مواصفات تقنية واضحة لفريق التطوير، ثم أتحقق من أن ما يُسلَّم يحقق النتيجة المطلوبة فعلاً."
    - step: { en: "Build", ar: "أبني" }
      title:
        en: "I build the tools myself"
        ar: "أبني الأدوات بنفسي"
      body:
        en: "Internal tools on the Odoo API: a B2B supplier dashboard, live KPI dashboards in Odoo and Metabase, and Python automation for recurring reports and manual processes."
        ar: "أدوات داخلية على Odoo API: لوحة للموردين (B2B)، ولوحات مؤشرات حيّة في Odoo وMetabase، وأتمتة بـ Python للتقارير والمهام اليدوية المتكررة."
    - step: { en: "Reconcile", ar: "أطابق" }
      title:
        en: "Accuracy, documented"
        ar: "دقة موثّقة"
      body:
        en: "I reconcile orders, invoices, and stock across systems, classify every mismatch by root cause, and document the evidence behind each finding."
        ar: "أطابق الطلبات والفواتير والمخزون بين الأنظمة، وأصنّف كل فرق حسب سببه الجذري، وأوثّق الدليل على كل نتيجة."
    - step: { en: "Grow", ar: "أتطوّر" }
      title:
        en: "Grown from the ground up"
        ar: "من الميدان إلى الإدارة"
      body:
        en: "From technical support and warehouse operations to running technical operations. I know how the work actually gets done."
        ar: "من الدعم الفني وإدارة المخازن إلى إدارة العمليات التقنية؛ أعرف كيف يُنجَز العمل على أرض الواقع."

experience:
  heading: { en: "Experience", ar: "الخبرة" }
  present: { en: "Present", ar: "الآن" }
  range_to: { en: "to", ar: "إلى" }
  status:
    current: { en: "Current", ar: "الحالي" }
    completed: { en: "Completed", ar: "مكتمل" }
    graduated: { en: "Graduated", ar: "تخرّج" }
  items:
    - kind: role
      id: tom
      short: { en: "Technical Operations", ar: "العمليات التقنية" }
      role:
        en: "Technical Operations Manager"
        ar: "مدير العمليات التقنية"
      org: "Presto"
      start: 2026-06
      end: null
      summary:
        en: "Grocery Division. Promoted from Category Manager."
        ar: "قسم المواد الغذائية. تمت ترقيتي من مدير فئة."
      highlights:
        - en: "Act as the technical bridge between the grocery division and the development team: turn operational needs into clear specifications, then verify that what is delivered matches the intended outcome."
          ar: "حلقة الوصل التقنية بين قسم المواد الغذائية وفريق التطوير: أحوّل احتياجات العمل إلى مواصفات واضحة، ثم أتحقق من أن ما يُسلَّم يحقق النتيجة المطلوبة."
        - en: "Own Odoo and the connected apps end to end for nine branches and warehouses: the customer and courier apps, the supplier dashboard and the Presto Panel."
          ar: "أتولى Odoo والتطبيقات المرتبطة به من البداية إلى النهاية لتسعة فروع ومخازن: تطبيقا العملاء والمندوبين، ولوحة الموردين، ولوحة Presto."
        - en: "First point of contact for incidents, with response-time targets measured in minutes: keep operations running with a temporary workaround until the root cause is fixed."
          ar: "نقطة الاتصال الأولى للأعطال، بأهداف استجابة تُقاس بالدقائق: أُبقي العمليات مستمرة بحل مؤقت حتى إصلاح السبب الجذري."
        - en: "Test every change on staging before production and sign off releases."
          ar: "أختبر كل تغيير في بيئة الاختبار قبل الإنتاج وأعتمد الإصدارات."
        - en: "Reconcile orders, invoices and stock between Odoo and the app, tracing each mismatch to its cause."
          ar: "أطابق الطلبات والفواتير والمخزون بين Odoo والتطبيق، وأتتبع كل فرق إلى سببه."
        - en: "Govern user roles and permissions, and review bulk updates to items, prices and quantities before they are applied."
          ar: "أدير أدوار المستخدمين وصلاحياتهم، وأراجع التحديثات المجمّعة للأصناف والأسعار والكميات قبل تطبيقها."
        - en: "Prepare Odoo and the connected apps for new branches and warehouses, and review data migration and import files before approval."
          ar: "أجهّز Odoo والتطبيقات المرتبطة للفروع والمخازن الجديدة، وأراجع ملفات نقل البيانات والاستيراد قبل اعتمادها."
        - en: "Build internal tools on the Odoo API and Python, and own the Metabase dashboards management uses daily."
          ar: "أبني أدوات داخلية على Odoo API وPython، وأتولى لوحات Metabase التي تستخدمها الإدارة يومياً."
        - en: "Work with the external Odoo partner: request changes and fixes, review and test their solutions before sign-off, and follow support, upgrades and post-go-live issues with them."
          ar: "أعمل مع شريك Odoo الخارجي: أطلب التعديلات والإصلاحات، وأراجع حلوله وأختبرها قبل اعتمادها، وأتابع معه الدعم والترقيات وما بعد الإطلاق."
        - en: "Define the KPI framework for the operations plan, and run user training and written guides to cut user errors."
          ar: "أضع إطار مؤشرات الأداء لخطة العمليات، وأقدّم تدريب المستخدمين وأدلة مكتوبة لتقليل الأخطاء."

    - kind: role
      id: cs
      short: { en: "Category Manager", ar: "مدير فئة" }
      role:
        en: "Category Manager"
        ar: "مدير فئة"
      org: "Presto"
      start: 2024-03
      end: 2026-06
      highlights:
        - en: "Ran grocery categories with thousands of items across the branches, and met the sales targets set for them."
          ar: "أدرت فئات غذائية بآلاف الأصناف عبر الفروع، وحققت أهداف المبيعات المحددة لها."
        - en: "Planned stock and reorders in Odoo and Excel from stock cover and sales history, and matched goods receipts to purchase orders."
          ar: "خططت المخزون وإعادة الطلب في Odoo وExcel بناءً على تغطية المخزون وتاريخ المبيعات، وطابقت الاستلامات مع أوامر الشراء."
        - en: "Tracked sales, velocity, availability and slow-moving stock by category, item and branch, and adjusted the range and replenishment to match."
          ar: "تابعت المبيعات وسرعة الدوران والتوفر والأصناف بطيئة الحركة حسب الفئة والصنف والفرع، وعدّلت التشكيلة وإعادة التموين وفقاً لذلك."
        - en: "Set prices against cost and competitors, kept branch price lists current, and used pricing, promotions and availability to grow category sales."
          ar: "حددت الأسعار مقابل التكلفة والمنافسين، وحدّثت قوائم أسعار الفروع، واستخدمت التسعير والعروض والتوفر لتنمية مبيعات الفئات."
        - en: "Coordinated suppliers day to day and helped launch new supply partnerships."
          ar: "نسّقت مع الموردين يومياً وساهمت في إطلاق شراكات توريد جديدة."
        - en: "Monitored stock across sub-warehouses, planned weekly distribution with marketing and operations, and prepared purchasing, restock and shortage reports for HQ and branches."
          ar: "تابعت المخزون عبر المخازن الفرعية، وخططت التوزيع الأسبوعي مع التسويق والعمليات، وأعددت تقارير الشراء وإعادة التموين والنواقص للإدارة والفروع."
        - en: "Assigned in 2025 to raise sales and service quality at the Benghazi branch warehouse."
          ar: "كُلّفت في 2025 برفع مستوى المبيعات وجودة الخدمة في مخزن فرع بنغازي."
        - en: "Supported the move from Odoo 16 to Odoo 19, checking stock and order data around the cutover."
          ar: "دعمت الانتقال من Odoo 16 إلى Odoo 19، مع التحقق من بيانات المخزون والطلبات خلال فترة التحويل."

    - kind: role
      id: warehouse
      short: { en: "Warehouse", ar: "المخزن" }
      role:
        en: "Warehouse Manager"
        ar: "مدير مخزن"
      org: "Al-Zaitoune Al-Bayda Co."
      start: 2023-03
      end: 2024-02
      highlights:
        - en: "Ran the raw materials warehouse that feeds the factory: receiving, storage, dispatch to production and stock reconciliation."
          ar: "أدرت مخزن المواد الخام الذي يغذي المصنع: الاستلام والتخزين والصرف للإنتاج ومطابقة المخزون."
        - en: "Ran weekly and monthly stock counts, and kept expiry dates under control with first expired, first out."
          ar: "أجريت جرداً أسبوعياً وشهرياً، وضبطت تواريخ الصلاحية بمبدأ الأقرب صلاحية يخرج أولاً."
        - en: "Kept stock records and item classification accurate, and worked with purchasing and production to keep stock at the right level and avoid shortages."
          ar: "حافظت على دقة سجلات المخزون وتصنيف الأصناف، وعملت مع المشتريات والإنتاج لإبقاء المخزون عند المستوى المناسب وتجنب النواقص."
        - en: "Led the warehouse team and the day-to-day workflow."
          ar: "قدت فريق المخزن وسير العمل اليومي."

    - kind: education
      id: bsc
      role:
        en: "BSc in Computer Science"
        ar: "بكالوريوس علوم الحاسوب"
      org: "Al-Rifaq University"
      start: null # graduation date only
      end: 2023-02
      summary:
        en: "Full-time study, graduated February 2023."
        ar: "تفرغ كامل للدراسة، وتخرجت في فبراير 2023."

    - kind: role
      id: helpdesk
      short: { en: "Sales Operations", ar: "عمليات المبيعات" }
      role:
        en: "Sales Operations Officer"
        ar: "مسؤول عمليات المبيعات"
      org: "Lion Star Company"
      start: 2020-01
      end: 2021-12
      highlights:
        - en: "Supported the ERP and sales system across the company's sales centres, resolving system issues for staff and customers and shortening response times."
          ar: "دعمت نظام ERP ونظام المبيعات في مراكز البيع، وعالجت مشكلات النظام للموظفين والعملاء وقلّصت أوقات الاستجابة."
        - en: "Supervised daily sales operations and made sure financial closing was done accurately."
          ar: "أشرفت على عمليات البيع اليومية وتأكدت من دقة الإقفال المالي."
        - en: "Supported sales initiatives and day-to-day performance at the sales centres."
          ar: "دعمت مبادرات المبيعات والأداء اليومي في مراكز البيع."

    - kind: role
      id: support
      short: { en: "Technical Support", ar: "الدعم الفني" }
      role:
        en: "Technical Support Specialist"
        ar: "أخصائي دعم فني"
      org: "Almedad Soft"
      start: 2019-09
      end: 2019-12
      highlights:
        - en: "Installed and configured the company's ERP and accounting system on client machines and got it running on site."
          ar: "نصّبت نظام ERP والمحاسبة الخاص بالشركة على أجهزة العملاء وهيّأته للعمل في موقعهم."
        - en: "Trained client staff on the system and supported them day to day."
          ar: "درّبت موظفي العملاء على النظام ودعمتهم في عملهم اليومي."
        - en: "Collected client change requests, clarified them and passed them to the development team."
          ar: "استقبلت طلبات التعديل من العملاء ووضّحتها ونقلتها إلى فريق التطوير."
        - en: "Provided technical support when clients hit problems, diagnosing and fixing software issues to reduce downtime."
          ar: "قدمت الدعم الفني عند مواجهة العملاء لمشكلات، وشخّصت أعطال البرمجيات وعالجتها لتقليل التوقف."

